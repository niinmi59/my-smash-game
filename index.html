<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>プラットフォーム・ファイター 試作版</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
        }
        canvas {
            background-color: #222;
            border: 4px solid #333;
            display: block;
            margin: 20px auto;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #444;
            color: white;
            border: none;
            cursor: pointer;
            margin: 0 5px;
        }
        button:hover { background-color: #666; }
        .active-ko { background-color: #ff69b4 !important; }
        .active-minto { background-color: #00ced1 !important; }
    </style>
</head>
<body>

    <h1>Platform Fighter Prototype</h1>
    <div>
        <button id="btnKo" class="active-ko" onclick="selectChar('ko')">こう (ピンク)</button>
        <button id="btnMinto" onclick="selectChar('minto')">みんと (水色)</button>
    </div>
    
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <div class="controls">
        <p><strong>操作方法 (P1):</strong> 移動: A (左) / D (右) / W (ジャンプ・上) / S (下)</p>
        <p>弱攻撃: <strong>J</strong> | 重攻撃: <strong>K</strong> | 剣を捨てる(みんと専用): <strong>U</strong></p>
        <p>※かなで(紫)は現在サンドバッグとして右側に配置されています。画面外に落とすと中央に復活します。</p>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// キー入力管理
const keys = {};
window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; handleKeyPress(e.key.toLowerCase()); });
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// ステージ（足場）
const stage = { x: 200, y: 350, width: 400, height: 20 };

// プレイヤー（操作キャラ）
let p1 = {
    charType: 'ko', // 'ko' or 'minto'
    x: 250, y: 200, vx: 0, vy: 0,
    width: 30, height: 60,
    color: '#ff69b4', damage: 0,
    isGrounded: false, facing: 1,
    // こう 専用ステータス
    isFlameUp: false,
    // みんと 専用ステータス
    hasSword: true,
    counterActive: false,
    hallucinationTimer: 0
};

// サンドバッグ（かなで）
let p2 = {
    x: 500, y: 200, vx: 0, vy: 0,
    width: 30, height: 60,
    color: '#8a2be2', damage: 0,
    isGrounded: false,
    stunTimer: 0
};

// 設置された剣の座標
let droppedSword = { x: 0, y: 0, active: false };
// 斬撃エフェクト・飛び道具
let projectiles = [];

// キャラクター切り替え
function selectChar(type) {
    p1.charType = type;
    p1.damage = 0;
    p1.isFlameUp = false;
    p1.hasSword = true;
    droppedSword.active = false;
    document.getElementById("btnKo").className = type === 'ko' ? "active-ko" : "";
    document.getElementById("btnMinto").className = type === 'minto' ? "active-minto" : "";
    p1.color = type === 'ko' ? '#ff69b4' : '#00ced1';
}

// 単発押しイベント（トグルや特殊行動用）
function handleKeyPress(key) {
    // 【こう】W+Kのトグル処理
    if (p1.charType === 'ko' && key === 'k' && keys['w']) {
        p1.isFlameUp = !p1.isFlameUp;
    }
    // 【こう】S+Kのギャンブル回復
    if (p1.charType === 'ko' && key === 'k' && keys['s']) {
        if (Math.random() < 0.6) {
            p1.damage *= 2; // 60%の確率で2倍のダメージ
        } else {
            p1.damage = 0;  // 40%の確率で0%に帳消し
        }
    }
    // 【みんと】Uキーで剣を捨てる
    if (p1.charType === 'minto' && key === 'u' && p1.hasSword) {
        p1.hasSword = false;
        droppedSword.x = p1.x;
        droppedSword.y = p1.y + 20;
        droppedSword.active = true;
    }
    // 【みんと】W+Kで剣の位置に瞬間移動
    if (p1.charType === 'minto' && key === 'k' && keys['w'] && droppedSword.active) {
        p1.x = droppedSword.x;
        p1.y = droppedSword.y - 20;
        p1.vx = 0; p1.vy = 0;
    }
    // 攻撃トリガー（Jキー、Kキー単体判定用）
    if (key === 'j') performAttack('j');
    if (key === 'k') performAttack('k');
}

// 攻撃ロジック
function performAttack(type) {
    let baseDamage = 0;
    let knockback = 0;
    let range = 40;
    
    if (p1.charType === 'ko') {
        // --- こうの技 ---
        if (type === 'j') { // 弱
            baseDamage = 5; knockback = 5;
        } else if (type === 'k') {
            if (keys['a'] || keys['d']) { // 横K（自傷大ダメージ）
                p1.damage += 8; baseDamage = 22; knockback = 15; range = 60;
            } else if (!keys['w'] && !keys['s']) { // 通常K（火をまとう軽ダメージ）
                baseDamage = 3; knockback = 2; range = 45;
            }
        }
    } else {
        // --- みんとの技 ---
        let attackMultiplier = p1.hasSword ? 1.3 : 1.0;
        if (type === 'j') { // 弱（剣ありならリーチ長）
            baseDamage = 6 * attackMultiplier;
            knockback = 6;
            range = p1.hasSword ? 65 : 40;
        } else if (type === 'k') {
            if (keys['a'] || keys['d']) { // 横K（大剣化、発生遅い想定で威力高）
                baseDamage = 25 * attackMultiplier; knockback = 14; range = 80;
            } else if (keys['s']) { // 下K（カウンター構え）
                p1.counterActive = true;
                setTimeout(() => { p1.counterActive = false; }, 500); // 0.5秒間受付
            } else if (!keys['w']) { // 通常K（斬撃を飛ばす）
                projectiles.push({
                    x: p1.x + (p1.facing * 20), y: p1.y + 20,
                    vx: p1.facing * 7, damage: 4, knockback: 1
                });
            }
        }
    }

    // 判定処理（簡易ヒットボックス判定）
    if (baseDamage > 0) {
        let hitX = p1.facing === 1 ? p1.x + p1.width : p1.x - range;
        if (hitX + range > p2.x && hitX < p2.x + p2.width && p1.y + p1.height > p2.y && p1.y < p2.y + p2.height) {
            // カウンターチェック
            applyHitToP2(baseDamage, knockback);
        }
    }
}

function applyHitToP2(damage, kb) {
    p2.damage += damage;
    // スマブラ式ぶっ飛び計算（％に応じて増加）
    let calculatedKb = kb * (1 + p2.damage / 50);
    p2.vx = p1.facing * calculatedKb;
    p2.vy = -calculatedKb * 0.5;
}

// ゲームループ
function update() {
    // --- 1. 固有ステータスの適用（速度・体重） ---
    let speed = p1.charType === 'ko' ? 5.5 : 3.5; // こうは速く、みんとは遅い
    let weightModifier = p1.charType === 'ko' ? 1.2 : 0.8; // こうは吹っ飛びやすく、みんとは重い

    // --- 2. プレイヤー移動処理 ---
    if (keys['a']) { p1.vx = -speed; p1.facing = -1; }
    else if (keys['d']) { p1.vx = speed; p1.facing = 1; }
    else { p1.vx *= 0.8; } // 摩擦

    if (keys['w'] && p1.isGrounded && !keys['k']) {
        p1.vy = -11;
        p1.isGrounded = false;
    }

    // こうのW+K（上昇能力トグル）
    if (p1.charType === 'ko' && p1.isFlameUp) {
        p1.vy = -4;       // 常に少しずつ上昇
        p1.damage += 0.05; // 自傷ダメージ蓄積
    }

    // みんとの幻覚タイマー
    if (p2.stunTimer > 0) {
        p2.stunTimer--;
        p2.vx = 0; // 動けない
    } else {
        p2.vx *= 0.9; // 通常のノックバック減速
    }

    // --- 3. 物理演算（重力・ステージ衝突判定） ---
    // P1 重力
    p1.vy += 0.5;
    p1.x += p1.vx; p1.y += p1.vy;
    // P2 重力
    p2.vy += 0.5;
    p2.x += p2.vx; p2.y += p2.vy;

    // P1 ステージ着地判定
    if (p1.x + p1.width > stage.x && p1.x < stage.x + stage.width &&
        p1.y + p1.height >= stage.y && p1.y + p1.height - p1.vy <= stage.y + 10) {
        p1.y = stage.y - p1.height; p1.vy = 0; p1.isGrounded = true;
    } else { p1.isGrounded = false; }

    // P2 ステージ着地判定
    if (p2.x + p2.width > stage.x && p2.x < stage.x + stage.width &&
        p2.y + p2.height >= stage.y && p2.y + p2.height - p2.vy <= stage.y + 10) {
        p2.y = stage.y - p2.height; p2.vy = 0; p2.isGrounded = true;
    }

    // 飛び道具の処理
    projectiles.forEach((proj, index) => {
        proj.x += proj.vx;
        // カウンター判定も兼ねたヒットチェック
        if (proj.x > p2.x && proj.x < p2.x + p2.width && proj.y > p2.y && proj.y < p2.y + p2.height) {
            applyHitToP2(proj.damage, proj.knockback);
            projectiles.splice(index, 1);
        }
        if (proj.x < 0 || proj.x > canvas.width) projectiles.splice(index, 1);
    });

    // バースト（画面外ミス）判定
    if (p1.x < 0 || p1.x > canvas.width || p1.y > canvas.height) { p1.x = 250; p1.y = 200; p1.vx = 0; p1.vy = 0; p1.damage = 0; p1.isFlameUp = false; }
    if (p2.x < 0 || p2.x > canvas.width || p2.y > canvas.height) { p2.x = 500; p2.y = 200; p2.vx = 0; p2.vy = 0; p2.damage = 0; }

    draw();
    requestAnimationFrame(update);
}

// 描画処理
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // ステージ描画
    ctx.fillStyle = "#666";
    ctx.fillRect(stage.x, stage.y, stage.width, stage.height);

    // 捨てられた剣の描画
    if (droppedSword.active) {
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(droppedSword.x, droppedSword.y);
        ctx.lineTo(droppedSword.x, droppedSword.y - 20);
        ctx.stroke();
    }

    // 飛び道具描画
    ctx.fillStyle = "#00ffff";
    projectiles.forEach(proj => { ctx.fillRect(proj.x, proj.y, 15, 4); });

    // P1 (操作キャラ) 棒人間描画
    drawStickman(p1.x + 15, p1.y + 40, p1.color, p1.charType === 'minto' && p1.hasSword, p1.facing);
    
    // こう の炎エフェクト
    if (p1.charType === 'ko' && p1.isFlameUp) {
        ctx.fillStyle = "rgba(255, 69, 0, 0.5)";
        ctx.fillRect(p1.x - 5, p1.y - 5, p1.width + 10, p1.height + 10);
    }

    // P2 (かなで / サンドバッグ) 棒人間描画
    drawStickman(p2.x + 15, p2.y + 40, p2.color, false, -1);
    if (p2.stunTimer > 0) { // 幻覚エフェクト
        ctx.fillStyle = "rgba(138, 43, 226, 0.4)";
        ctx.fillRect(p2.x - 5, p2.y - 5, p2.width + 10, p2.height + 10);
    }

    // UI (ダメージ％など)
    ctx.fillStyle = "#fff";
    ctx.font = "20px Arial";
    ctx.fillText(`P1 (${p1.charType === 'ko' ? 'こう' : 'みんと'}): ${Math.floor(p1.damage)}%`, 50, 50);
    ctx.fillText(`P2 (かなで): ${p2.damage}%`, 600, 50);
}

// 棒人間を描画する共通関数
function drawStickman(x, y, color, hasSword, facing) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(x, y - 30, 10, 0, Math.PI * 2); // 頭
    ctx.moveTo(x, y - 20); ctx.lineTo(x, y); // 体
    ctx.moveTo(x, y - 15); ctx.lineTo(x - 15 * facing, y - 10); // 左手
    ctx.moveTo(x, y - 15); ctx.lineTo(x + 15 * facing, y - 5);  // 右手
    ctx.moveTo(x, y); ctx.lineTo(x - 10, y + 20); // 左足
    ctx.moveTo(x, y); ctx.lineTo(x + 10, y + 20); // 右足
    ctx.stroke();

    if (hasSword) { // 剣の描画
        ctx.strokeStyle = "#aaa";
        ctx.beginPath();
        ctx.moveTo(x + 15 * facing, y - 5);
        ctx.lineTo(x + 35 * facing, y - 20);
        ctx.stroke();
    }
}

// カウンター用の特殊フック
function checkCounter() {
    if (p1.charType === 'minto' && p1.counterActive) {
        p2.stunTimer = 180; // 3秒間（60fps × 3）幻覚で拘束
        p1.counterActive = false;
        return true;
    }
    return false;
}

// 簡易的な攻撃ヒット時の身代わり（P2から攻撃を受けるシステムを後で作る用の布石）
// 今回はサンドバッグなので、プレイヤーが攻撃したときにみんとのカウンター構え中なら...という判定を組み込んでいます。

update();
</script>
</body>
</html>
